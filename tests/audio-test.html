<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cumbre Rush — prueba de audio</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #12202f; color: #e8eef5; margin: 0; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    h2 { font-size: 15px; margin: 20px 0 8px; color: #9fc3e6; }
    .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    button { background: #2a4560; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
    button:hover { background: #3a5f84; }
    label { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; }
    table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
    td, th { padding: 3px 10px; border-bottom: 1px solid #2a4560; text-align: right; }
    td:first-child, th:first-child { text-align: left; }
    .bad { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>Cumbre Rush — prueba de audio</h1>
  <p>Haz clic en cualquier botón para desbloquear el audio.</p>
  <h2>Efectos</h2>
  <div class="grid" id="sfx"></div>
  <h2>Música</h2>
  <div id="music"></div>
  <h2>Motor</h2>
  <div>
    <label>Velocidad <input type="range" id="engine" min="0" max="1" step="0.01" value="0" /></label>
    <label><input type="checkbox" id="boost" /> Boost</label>
    <label><input type="checkbox" id="drift" /> Derrape</label>
    <button id="engineOn">Encender</button>
    <button id="engineOff">Apagar</button>
  </div>
  <h2>Volúmenes</h2>
  <div>
    <label>Música <input type="range" id="volMusic" min="0" max="1" step="0.01" value="0.6" /></label>
    <label>SFX <input type="range" id="volSfx" min="0" max="1" step="0.01" value="0.8" /></label>
  </div>
  <h2>Análisis offline (RMS / pico)</h2>
  <button id="analyze">Analizar</button>
  <div id="report"></div>
  <script type="module" src="/src/audio/testPage.js"></script>
</body>
</html>
